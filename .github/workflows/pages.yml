# Publishes the read-only hosted demo and the pitch deck to GitHub Pages on every push to main.
# Pages can't run the Python backend, so the backend exports every API response as JSON first
# (backend/app/static_export.py) and the frontend is built to read those files (VITE_STATIC=1).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test the backend and export the demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q
          python -m app.static_export ../frontend/public/demo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the static site
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
